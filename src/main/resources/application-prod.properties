# =====================================================================
# Perfil de producción: Render (servidor) + Supabase (PostgreSQL).
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
# Los datos de conexión NO se escriben aquí: se cargan en Render como
# variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# =====================================================================

# --- Base de datos (Supabase, "Session pooler") ---
# Ejemplo de DB_URL:
# jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# El plan gratuito de Supabase admite pocas conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- Vistas ---
spring.thymeleaf.cache=true

# --- Detrás del proxy HTTPS de Render ---
# Respeta X-Forwarded-Proto para que las redirecciones usen https://
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# --- Pantalla de ingreso ---
app.mostrar-usuarios-demo=${MOSTRAR_USUARIOS_DEMO:false}
