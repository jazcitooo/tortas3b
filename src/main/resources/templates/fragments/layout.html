<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Fragmentos comunes del sistema:
  - head(titulo): etiquetas <head>, CSS
  - encabezado: barra superior con navegación por roles y usuario conectado
  - mensajes: alertas flash de éxito / error / advertencia
  - modalConfirmar: diálogo modal de confirmación
  - scripts: JavaScript global
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Tortas y Chocolates 3B'">Tortas y Chocolates 3B</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header th:fragment="encabezado" class="barra">
    <a class="marca" th:href="@{/dashboard}">
        <span class="marca-icono" aria-hidden="true">🎂</span>
        <span>Tortas y Chocolates <strong>3B</strong></span>
    </a>
    <button class="menu-boton" type="button" aria-label="Abrir menú"
            aria-expanded="false" aria-controls="menu-principal">☰</button>
    <nav id="menu-principal" class="menu">
        <a th:href="@{/dashboard}">📊 Dashboard</a>
        <a th:href="@{/pedidos}">📝 Pedidos</a>
        <a th:href="@{/delivery}">🛵 Delivery</a>
        <a th:href="@{/clientes}">👥 Clientes</a>
        <a th:href="@{/productos}">🍰 Productos</a>
        <a th:href="@{/ventas}">💰 Ventas / Caja</a>

        <!-- Módulos exclusivos para Administrador -->
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ingredientes}">📦 Inventario</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/compras}">🛒 Compras</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/proveedores}">🏭 Proveedores</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">👤 Usuarios</a>
        
        <!-- Reportes -->
        <a th:href="@{/reportes/entregas}">📋 Rep. Entregas</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/reportes/ganancias}">📈 Rep. Ganancias</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/reportes/productos-mas-vendidos}">🏆 Más Vendidos</a>

        <!-- Usuario y cierre de sesión -->
        <div class="menu-usuario" style="margin-left: auto; display: flex; align-items: center; gap: .75rem;">
            <span style="font-size: .85rem; color: var(--rosa-suave);" sec:authentication="name">Usuario</span>
            <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                <button type="submit" class="boton boton-secundario boton-chico" style="padding: .2rem .5rem; font-size: .8rem; background: rgba(255,255,255,0.2); color:#fff; border-color: rgba(255,255,255,0.4);">Salir</button>
            </form>
        </div>
    </nav>
</header>

<div th:fragment="mensajes" class="mensajes">
    <div class="alerta alerta-exito" th:if="${exito}" th:text="${exito}" role="status"></div>
    <div class="alerta alerta-error" th:if="${error}" th:text="${error}" role="alert"></div>
    <div class="alerta alerta-advertencia" th:if="${advertencia}" th:text="${advertencia}" role="status"></div>
</div>

<div th:fragment="modalConfirmar" class="modal" id="modal-confirmar" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <h2 id="modal-titulo">Confirmar acción</h2>
        <p id="modal-texto">¿Está seguro de continuar?</p>
        <div class="modal-botones">
            <button type="button" class="boton boton-secundario" id="modal-cancelar">Cancelar</button>
            <button type="button" class="boton boton-peligro" id="modal-aceptar">Sí, continuar</button>
        </div>
    </div>
</div>

<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
