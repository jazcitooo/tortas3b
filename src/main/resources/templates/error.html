<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: encabezado}"></header>

<!-- Página de error genérica: no muestra detalles técnicos al usuario -->
<main class="contenido">
    <section class="tarjeta centrado">
        <h1 th:switch="${status}">
            <span th:case="403">No tiene permiso para ver esta página</span>
            <span th:case="404">Página no encontrada</span>
            <span th:case="*">Ocurrió un error inesperado</span>
        </h1>
        <p class="texto-suave">Código: <span th:text="${status}">500</span></p>
        <a class="boton" th:href="@{/}">Volver al inicio</a>
    </section>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
