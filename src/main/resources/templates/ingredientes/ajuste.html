<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ajuste de Stock')}"></head>
<body>
<header th:replace="~{fragments/layout :: encabezado}"></header>

<main class="contenido">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div style="max-width: 550px; margin: 0 auto;">
        <h1>Ajuste Manual de Inventario</h1>
        <p class="texto-suave">
            Ajuste para: <strong th:text="${ingrediente.nombre}">Harina</strong> 
            (Stock actual: <strong th:text="${#numbers.formatDecimal(ingrediente.stockActual, 1, 'POINT', 3, 'COMMA')} + ' ' + ${ingrediente.unidad}">0</strong>)
        </p>

        <section class="tarjeta">
            <form th:action="@{/ingredientes/ajustar}" method="post" class="formulario">
                <input type="hidden" name="ingredienteId" th:value="${ingrediente.id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="campo">
                    <label for="cantidad" class="obligatorio">Cantidad a Ajustar (+ entrada, − salida)</label>
                    <input type="number" id="cantidad" name="cantidad" step="0.001" required placeholder="Ej. 5.000 para sumar, -2.500 para restar">
                    <span class="texto-suave" style="font-size: .85rem;">
                        Ingrese número positivo para agregar stock, o negativo para dar de baja mermas/roturas.
                    </span>
                </div>

                <div class="campo">
                    <label for="motivo" class="obligatorio">Motivo del Ajuste (Auditoría)</label>
                    <textarea id="motivo" name="motivo" rows="3" required placeholder="Ej. Corrección por inventario físico, merma por rotura de empaque, donación..."></textarea>
                </div>

                <div class="acciones" style="margin-top: 1rem;">
                    <button type="submit" class="boton">Confirmar Ajuste</button>
                    <a th:href="@{/ingredientes}" class="boton boton-secundario">Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
