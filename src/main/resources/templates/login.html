<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión · Tortas y Chocolates 3B</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        .login-contenedor {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--crema) 0%, #faede1 100%);
        }
        .login-tarjeta {
            background: var(--blanco);
            border: 1px solid var(--borde);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(62, 37, 25, 0.12);
            padding: 2.2rem;
            max-width: 420px;
            width: 100%;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-logo span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: .4rem;
        }
        .credenciales-demo {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--rosa-suave);
            border-radius: 8px;
            font-size: .85rem;
            color: var(--chocolate-oscuro);
        }
    </style>
</head>
<body>

<div class="login-contenedor">
    <div class="login-tarjeta">
        <div class="login-logo">
            <span>🎂</span>
            <h1>Tortas y Chocolates <strong>3B</strong></h1>
            <p class="texto-suave">Sistema de Gestión y Control de Producción</p>
        </div>

        <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>
        <div th:if="${exito}" class="alerta alerta-exito" th:text="${exito}"></div>

        <form th:action="@{/login}" method="post" class="formulario">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="campo">
                <label for="username" class="obligatorio">Usuario</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Ej. admin u operador">
            </div>

            <div class="campo">
                <label for="password" class="obligatorio">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="acciones" style="margin-top: .5rem;">
                <button type="submit" class="boton" style="width: 100%; padding: .75rem; font-weight: 600;">Ingresar al Sistema</button>
            </div>
        </form>

        <div class="credenciales-demo" th:if="${mostrarUsuariosDemo}">
            <strong>Usuarios de prueba (demo):</strong><br>
            • Administrador: <code>admin</code> / <code>password</code><br>
            • Operador: <code>operador</code> / <code>password</code>
        </div>
    </div>
</div>

</body>
</html>
