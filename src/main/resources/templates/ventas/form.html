<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar Cobro en Caja')}"></head>
<body>
<header th:replace="~{fragments/layout :: encabezado}"></header>

<main class="contenido">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div style="max-width: 550px; margin: 0 auto;">
        <h1>Registrar Cobro en Caja</h1>
        <p class="texto-suave">
            Cobro del Pedido <strong>#<span th:text="${pedido.id}">1</span></strong> de <span th:text="${pedido.clienteNombre}">Cliente</span>.
        </p>

        <section class="tarjeta">
            <div style="background: var(--rosa-suave); padding: 1.25rem; border-radius: 8px; margin-bottom: 1.25rem; text-align: center;">
                <span class="texto-suave" style="font-size: .9rem;">Total a Cobrar:</span><br>
                <span style="font-size: 2.2rem; font-weight: 700; color: var(--chocolate);"
                      th:text="${#numbers.formatDecimal(pedido.total, 0, 'POINT', 0, 'COMMA')} + ' Gs.'">120.000 Gs.</span>
            </div>

            <form th:action="@{/ventas/guardar}" method="post" class="formulario">
                <input type="hidden" name="pedidoId" th:value="${pedido.id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="campo">
                    <label for="metodoPago" class="obligatorio">Método de Pago</label>
                    <select id="metodoPago" name="metodoPago" required>
                        <option value="EFECTIVO">💵 Efectivo</option>
                        <option value="TRANSFERENCIA">📱 Transferencia Bancaria (SIPAP / QR)</option>
                        <option value="OTRO">💳 Tarjeta / Otro</option>
                    </select>
                </div>

                <div class="acciones" style="margin-top: 1rem;">
                    <button type="submit" class="boton" style="width: 100%; padding: .75rem; font-weight: 600;">Confirmar Ingreso a Caja</button>
                    <a th:href="@{/pedidos/detalle/{id}(id=${pedido.id})}" class="boton boton-secundario" style="width: 100%; text-align: center;">Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
