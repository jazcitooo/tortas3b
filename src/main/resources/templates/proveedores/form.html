<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${proveedor.id != null ? 'Editar Proveedor' : 'Nuevo Proveedor'})}"></head>
<body>
<header th:replace="~{fragments/layout :: encabezado}"></header>

<main class="contenido">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div style="max-width: 600px; margin: 0 auto;">
        <h1 th:text="${proveedor.id != null ? 'Editar Proveedor' : 'Nuevo Proveedor'}">Proveedor</h1>
        <p class="texto-suave">Cargue los datos comerciales para órdenes de compra y contacto.</p>

        <section class="tarjeta">
            <form th:action="${proveedor.id != null ? '/proveedores/actualizar' : '/proveedores/guardar'}" method="post" class="formulario">
                <input type="hidden" name="id" th:value="${proveedor.id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="campo">
                    <label for="nombre" class="obligatorio">Razón Social o Nombre del Proveedor</label>
                    <input type="text" id="nombre" name="nombre" th:value="${proveedor.nombre}" required placeholder="Ej. Distribuidora San José">
                </div>

                <div class="campo">
                    <label for="telefono" class="obligatorio">Teléfono de Contacto</label>
                    <input type="text" id="telefono" name="telefono" th:value="${proveedor.telefono}" required
                           pattern="^\d{7,15}$" title="Ingrese entre 7 y 15 dígitos numéricos" placeholder="Ej. 0981112233">
                </div>

                <div class="campo">
                    <label for="direccion">Dirección Comercial</label>
                    <input type="text" id="direccion" name="direccion" th:value="${proveedor.direccion}" placeholder="Ej. Avda. Eusebio Ayala 1234">
                </div>

                <div class="campo">
                    <label for="insumos">Insumos que suministra</label>
                    <textarea id="insumos" name="insumos" rows="3" th:text="${proveedor.insumos}" placeholder="Harinas, chocolates en barra, esencias..."></textarea>
                </div>

                <div class="acciones" style="margin-top: 1rem;">
                    <button type="submit" class="boton">Guardar Proveedor</button>
                    <a th:href="@{/proveedores}" class="boton boton-secundario">Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
