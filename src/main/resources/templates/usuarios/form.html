<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${usuario.id != null ? 'Editar Usuario' : 'Nuevo Usuario'})}"></head>
<body>
<header th:replace="~{fragments/layout :: encabezado}"></header>

<main class="contenido">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div style="max-width: 600px; margin: 0 auto;">
        <h1 th:text="${usuario.id != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Usuario</h1>
        <p class="texto-suave">Ingrese los datos para la cuenta y asigne los permisos correspondientes.</p>

        <section class="tarjeta">
            <form th:action="${usuario.id != null ? '/usuarios/actualizar' : '/usuarios/guardar'}" method="post" class="formulario">
                <input type="hidden" name="id" th:value="${usuario.id}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="campo">
                    <label for="nombre" class="obligatorio">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" th:value="${usuario.nombre}" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="campo">
                    <label for="username" class="obligatorio">Nombre de Usuario (Login)</label>
                    <input type="text" id="username" name="username" th:value="${usuario.username}" required placeholder="Ej. juanp">
                </div>

                <div class="campo">
                    <label for="password" th:classappend="${usuario.id == null ? 'obligatorio' : ''}">
                        Contraseña <span th:if="${usuario.id != null}" class="texto-suave">(dejar en blanco para conservar la actual)</span>
                    </label>
                    <input type="password" id="password" name="password" th:required="${usuario.id == null}" placeholder="••••••••">
                </div>

                <div class="campo">
                    <label for="rol" class="obligatorio">Rol del Usuario</label>
                    <select id="rol" name="rol" required>
                        <option value="OPERADOR" th:selected="${usuario.rol == 'OPERADOR'}">OPERADOR (Gestión de pedidos, clientes y entregas)</option>
                        <option value="ADMIN" th:selected="${usuario.rol == 'ADMIN'}">ADMIN (Acceso total, inventario, reportes financieros y usuarios)</option>
                    </select>
                </div>

                <div class="acciones" style="margin-top: 1rem;">
                    <button type="submit" class="boton">Guardar Usuario</button>
                    <a th:href="@{/usuarios}" class="boton boton-secundario">Cancelar</a>
                </div>
            </form>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
