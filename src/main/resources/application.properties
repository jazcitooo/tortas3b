# =====================================================================
# Configuración general. NO poner contraseñas aquí.
# Las credenciales de la base van en application-local.properties
# (copiar application-local.properties.example) o en variables de entorno.
# =====================================================================
spring.application.name=tortas3b
# Render indica el puerto en la variable PORT; en la PC se usa 8080
server.port=${PORT:8080}
# En Render se define SPRING_PROFILES_ACTIVE=prod (ver application-prod.properties)
spring.profiles.active=local

# --- Base de datos ---
spring.datasource.url=jdbc:mysql://localhost:3306/tortas3b?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Asuncion&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- Vistas ---
spring.thymeleaf.cache=false

# --- Seguridad básica de errores y sesión ---
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# --- Reglas del negocio (Tortas y Chocolates 3B) ---
negocio.porcentaje-ganancia=0.38
negocio.max-entregas-por-hora=5
negocio.hora-apertura=08:00
negocio.hora-cierre=20:00

# --- Pantalla de ingreso ---
# Muestra el recuadro con los usuarios de prueba (se apaga en producción)
app.mostrar-usuarios-demo=true
